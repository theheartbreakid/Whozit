<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F5F8FE" />
      <stop offset="100%" stop-color="#E1ECFA" />
    </linearGradient>

    <!-- Foreground Element Gradients -->
    <linearGradient id="arc_ul" x1="31.96" y1="33.35" x2="47.54" y2="57.65" gradientUnits="userSpaceOnUse">
