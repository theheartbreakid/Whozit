      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F1E36" flood-opacity="0.08" />
    </filter>

    <!-- Inner highlight stroke -->
    <linearGradient id="stroke_highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- App Icon Squircle Container -->
