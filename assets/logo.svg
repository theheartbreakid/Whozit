    <linearGradient id="arc_bot" x1="40.04" y1="69.04" x2="67.71" y2="77.22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A90FF" />
      <stop offset="100%" stop-color="#7A44E6" />
    </linearGradient>
    <linearGradient id="dot_top" x1="54" y1="26" x2="54" y2="39.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4CC2FF" />
      <stop offset="100%" stop-color="#2B84FF" />
    </linearGradient>
