      <stop offset="100%" stop-color="#4270F6" />
    </linearGradient>
    <linearGradient id="arc_ur" x1="59.35" y1="33.59" x2="77.15" y2="57.66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A6CFF" />
      <stop offset="100%" stop-color="#7446E4" />
